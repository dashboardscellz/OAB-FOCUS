function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function addXP(n){state.progress.xp=Math.max(0,(state.progress.xp||0)+Math.max(0,Math.round(n)))}
function badgeEligible(id){const p=state.progress,mins=p.studySeconds/60,acc=accuracy(),ds=disciplineStats();const has=(d)=>ds.find(x=>x.discipline===d&&x.attempts>=20&&x.accuracy>=80);if(id==='focus-10')return mins>=10;if(id==='focus-120')return mins>=120;if(id==='focus-600')return mins>=600;if(id==='q-10')return p.questionCount>=10;if(id==='q-50')return p.questionCount>=50;if(id==='q-100')return p.questionCount>=100;if(id==='q-500')return p.questionCount>=500;if(id==='q-1000')return p.questionCount>=1000;if(id==='q-2000')return p.questionCount>=2000;if(id==='q-3000')return p.questionCount>=3000;if(id==='accuracy-80')return p.questionCount>=30&&acc>=80;if(id==='streak-3')return p.streak.current>=3;if(id==='streak-7')return p.streak.current>=7;if(id==='sim-pass')return p.simulationHistory.some(x=>x.total>=80&&x.score>=40);if(id==='lei-seca')return (p.studyByLesson.legislacao||0)>=3600;if(id==='recovery')return (p.recoveredErrors||0)>=1;if(id==='master-ethics')return !!has('Ética');if(id==='master-const')return !!has('Constitucional');if(id==='master-civil')return !!has('Civil');if(id==='master-penal')return !!has('Penal');if(id==='master-process')return !!(has('Processo Civil')||has('Processo Penal'));return false}
function checkBadges(){let changed=false;for(const b of state.content?.badges||[]){if(!state.progress.badges[b.id]&&badgeEligible(b.id)){state.progress.badges[b.id]=Date.now();addXP(50);toast(`🏅 Nova insígnia: ${b.name}`);changed=true}}return changed}

async function persistProgress(silent=true){if(!state.user||!state.progress)return;state.progress.updatedAt=Date.now();localStorage.setItem(`oabfocus-progress-${state.user.uid}`,JSON.stringify(state.progress));clearTimeout(state.saveTimer);state.saveTimer=setTimeout(async()=>{try{await set(ref(db,`progress/${state.user.uid}`),state.progress);await updateLeaderboard()}catch(e){if(!silent)toast('Não foi possível sincronizar agora. O progresso ficou salvo neste navegador.','bad')}},250)}
async function updateLeaderboard(){if(!state.user||!state.profile||!state.progress)return;const li=levelInfo(state.progress.xp||0);await set(ref(db,`leaderboard/${state.user.uid}`),{name:state.profile.displayName||state.profile.username||'Usuário',xp:state.progress.xp||0,level:li.level,questions:state.progress.questionCount||0,correct:state.progress.correctCount||0,accuracy:accuracy(),studySeconds:state.progress.studySeconds||0,updatedAt:Date.now()})}

function activeDelta(session){if(!session||!session.runningSince)return 0;return Math.max(0,Math.floor((Date.now()-session.runningSince)/1000))}
function flushStudy(render=false){const s=state.studySession;if(!s)return;const delta=activeDelta(s);if(delta>0){s.runningSince=document.hidden?0:Date.now();state.progress.studySeconds+=delta;state.progress.studyByLesson[s.lessonId]=(state.progress.studyByLesson[s.lessonId]||0)+delta;const day=todayKey();state.progress.studyByDay[day]=(state.progress.studyByDay[day]||0)+delta;touchActivity();const before=Math.floor((s.countedSeconds||0)/60),after=Math.floor(((s.countedSeconds||0)+delta)/60);if(after>before)addXP((after-before)*2);s.countedSeconds=(s.countedSeconds||0)+delta;checkBadges();persistProgress()}if(render)updateLiveTimers()}
function startStudy(lessonId){endQuestionSession();if(state.studySession?.lessonId===lessonId)return;endStudy();state.studySession={lessonId,runningSince:document.hidden?0:Date.now(),countedSeconds:0}}
function endStudy(){if(!state.studySession)return;flushStudy();state.studySession=null}
function pauseStudy(){flushStudy();if(state.studySession)state.studySession.runningSince=0}
function resumeStudy(){if(state.studySession&&!state.studySession.runningSince)state.studySession.runningSince=Date.now()}
function startQuestionSession(qid){endStudy();endQuestionSession();state.questionSession={qid,runningSince:document.hidden?0:Date.now(),countedSeconds:0}}
function flushQuestionTime(){const s=state.questionSession;if(!s)return 0;const delta=activeDelta(s);if(delta>0){s.runningSince=document.hidden?0:Date.now();s.countedSeconds+=delta;state.progress.questionSeconds+=delta;const day=todayKey();state.progress.questionByDay[day]=(state.progress.questionByDay[day]||0)+delta;touchActivity();persistProgress()}return s.countedSeconds||0}
function endQuestionSession(){if(!state.questionSession)return 0;const t=flushQuestionTime();state.questionSession=null;return t}

document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseStudy();flushQuestionTime();if(state.questionSession)state.questionSession.runningSince=0}else{resumeStudy();if(state.questionSession&&!state.questionSession.runningSince)state.questionSession.runningSince=Date.now()}});
window.addEventListener('beforeunload',()=>{flushStudy();flushQuestionTime()});
setInterval(()=>{flushStudy(true);flushQuestionTime();updateLiveTimers()},15000);

function updateLiveTimers(){const st=$('[data-study-timer]');if(st&&state.studySession){const total=(state.studySession.countedSeconds||0)+activeDelta(state.studySession);st.textContent=fmtClock(total)}const qt=$('[data-q-timer]');if(qt&&state.questionSession){const total=(state.questionSession.countedSeconds||0)+activeDelta(state.questionSession);qt.textContent=fmtClock(total)}}

function protection(){const student=state.profile?.role!=='admin';document.body.classList.toggle('protect',student);const wm=$('#watermark');wm.innerHTML='';if(student){const label=`${state.profile.displayName||state.profile.username} • OAB FOCUS • USO PESSOAL`;for(let y=7;y<100;y+=21)for(let x=-5;x<110;x+=34){const s=document.createElement('span');s.className='wm';s.style.left=x+'%';s.style.top=y+'%';s.textContent=label;wm.appendChild(s)}}}
for(const ev of ['copy','cut','contextmenu','dragstart'])document.addEventListener(ev,e=>{if(document.body.classList.contains('protect')&&e.target.closest?.('.reader-main,.question-card,.commentary')){e.preventDefault();toast('Conteúdo protegido para uso pessoal.','bad')}});
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('protect'))return;const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','p','s','u'].includes(k)){e.preventDefault();toast('Ação bloqueada no material protegido.','bad')}if(e.key==='F12')e.preventDefault()});

function loginScreen(msg=''){app.innerHTML=`<div class="login-shell"><div class="login-card"><div class="login-logo"><div class="brandmark">O</div><div><h1>OAB Focus</h1><span class="eyebrow">Plataforma de estudos</span></div></div><h2>Entrar</h2><p>Seu progresso, materiais, questões e conquistas em um só lugar.</p><form id="loginForm"><div class="field"><label>Usuário</label><input class="input" id="loginUser" autocomplete="username" value="Manassés"></div><div class="field"><label>Senha</label><input class="input" id="loginPass" type="password" autocomplete="current-password" value="12345"></div><button class="btn" style="width:100%;margin-top:8px">Acessar plataforma</button><div class="login-error">${esc(msg)}</div></form></div></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();await doLogin($('#loginUser').value,$('#loginPass').value)}}
async function doLogin(username,password){const u=slugify(username);if(!u||!password)return loginScreen('Informe usuário e senha.');state.loggingIn=true;try{let cred;try{cred=await signInWithEmailAndPassword(auth,userEmail(u),authPassword(password))}catch(err){if(u===ADMIN_SLUG&&['auth/invalid-credential','auth/user-not-found'].includes(err.code)){cred=await createUserWithEmailAndPassword(auth,userEmail(u),authPassword(password))}else throw err}state.user=cred.user;await bootstrapProfile(u,username);await loadSession();state.loggingIn=false}catch(e){state.loggingIn=false;console.error(e);loginScreen(e.code==='auth/invalid-credential'?'Usuário ou senha incorretos.':`Não foi possível entrar: ${e.message||e}`)}}
async function bootstrapProfile(u,display){const adminSnap=await get(ref(db,'settings/adminUid'));if(!adminSnap.exists()&&u===ADMIN_SLUG){await set(ref(db,'settings/adminUid'),state.user.uid);await set(ref(db,`profiles/${state.user.uid}`),{username:'Manassés',displayName:'Manassés',role:'admin',active:true,createdAt:Date.now()});await set(ref(db,'usernames/manasses'),state.user.uid)}}
async function loadSession(){app.innerHTML='<div class="loading"><div><div class="spinner"></div>Carregando OAB Focus...</div></div>';const ps=await get(ref(db,`profiles/${state.user.uid}`));if(!ps.exists()||ps.val().active!==true){await signOut(auth);return loginScreen('Conta não autorizada ou desativada pelo administrador.')}state.profile=ps.val();protection();const [cs,pr]=await Promise.all([get(ref(db,'content')),get(ref(db,`progress/${state.user.uid}`))]);state.content=cs.exists()?cs.val():null;let cloud=normalizeProgress(pr.exists()?pr.val():null);const localRaw=localStorage.getItem(`oabfocus-progress-${state.user.uid}`);if(localRaw){try{const local=normalizeProgress(JSON.parse(localRaw));if((local.updatedAt||0)>(cloud.updatedAt||0))cloud=local}catch{}}state.progress=cloud;await persistProgress();if(!state.content&&state.profile.role==='admin'){state.view='admin'}render();}

function navItems(){const base=[['dashboard','⌂','Início'],['study','▤','Estudar'],['questions','?','Questões'],['simulations','◷','Simulados'],['stats','▥','Estatísticas'],['ranking','↗','Ranking'],['badges','✦','Conquistas']];if(state.profile?.role==='admin')base.push(['admin','⚙','Admin']);return base}
function layout(inner,title){const li=levelInfo(state.progress?.xp||0);const nav=navItems();return `<div class="shell"><aside class="sidebar"><div class="side-brand"><div class="brandmark">O</div><div><strong>OAB Focus</strong><span>1ª fase • estudo inteligente</span></div></div><nav class="nav">${nav.map(n=>`<button class="nav-btn ${state.view===n[0]?'active':''}" data-nav="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav><div class="side-bottom"><div class="profile-mini"><div class="avatar">${esc((state.profile?.displayName||'U')[0])}</div><div><strong>${esc(state.profile?.displayName||state.profile?.username)}</strong><span>${state.profile?.role==='admin'?'Administrador':'Aluno'} • Nível ${li.level}</span></div></div><button class="nav-btn" id="logoutBtn" style="margin-top:10px;width:100%">↪ Sair</button></div></aside><main class="main"><header class="topbar"><div class="page-title">${esc(title)}</div><div class="top-actions"><div class="level-pill"><b>LV ${li.level}</b><span class="small">${esc(li.title)}</span><span class="xp-mini"><i style="width:${li.pct}%"></i></span></div></div></header><section class="content">${inner}</section></main><nav class="mobile-nav">${nav.slice(0,5).map(n=>`<button class="${state.view===n[0]?'active':''}" data-nav="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav></div>`}
function bindNav(){$$('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#logoutBtn')?.addEventListener('click',async()=>{endStudy();endQuestionSession();await signOut(auth);state.user=null;state.profile=null;state.content=null;state.progress=null;loginScreen()})}
function go(v){endStudy();endQuestionSession();state.view=v;state.reader=null;state.q=null;state.sim=null;render()}

function contentMissing(){return `<div class="card empty"><h2>Conteúdo ainda não importado</h2><p>Entre em <b>Admin</b> e importe o arquivo privado de conteúdo. O repositório do GitHub contém apenas a aplicação.</p><button class="btn" data-nav="admin">Abrir Admin</button></div>`}
function metric(label,value,delta=''){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div>${delta?`<div class="delta">${delta}</div>`:''}</div>`}
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({key:todayKey(d),label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')})}return a}
function weeklySeconds(){return last7().reduce((s,d)=>s+(state.progress.studyByDay[d.key]||0)+(state.progress.questionByDay[d.key]||0),0)}
function strengths(){const ds=disciplineStats().filter(x=>x.attempts>=5);return{best:ds.slice(0,3),weak:[...ds].sort((a,b)=>a.accuracy-b.accuracy||b.attempts-a.attempts).slice(0,3)}}
function dailyMission(){const t=todayKey();let q=0,c=0;for(const a of values(state.progress.attempts)){if(a.lastDay===t)q+=a.todayCount||0}const sec=(state.progress.studyByDay[t]||0)+(state.progress.questionByDay[t]||0);return{q,sec}}
function dashboard(){if(!state.content)return contentMissing();const li=levelInfo(state.progress.xp),sw=strengths(),dm=dailyMission();const unlocked=Object.keys(state.progress.badges).length;return `<div class="hero"><div class="hero-main"><div class="eyebrow">Seu ciclo de aprovação</div><h1>${esc(state.profile.displayName)}, bora subir mais um nível?</h1><p>O OAB Focus combina leitura ativa, questões reais, revisão de erros e dados do seu desempenho para decidir o que merece mais atenção.</p><div class="hero-row"><button class="btn" data-nav="study">Continuar estudando</button><button class="btn secondary" data-nav="questions">Resolver questões</button></div></div><div class="card mission"><div><div class="eyebrow">Missões de hoje</div><h3 style="margin:7px 0 0">Foco diário</h3></div><div class="mission-row"><div><b>30 min de foco</b><div class="progress"><span style="width:${Math.min(100,dm.sec/1800*100)}%"></span></div></div><span>${Math.round(dm.sec/60)}/30</span></div><div class="mission-row"><div><b>20 questões</b><div class="progress gold"><span style="width:${Math.min(100,dm.q/20*100)}%"></span></div></div><span>${dm.q}/20</span></div><div class="small muted">Sequência atual: 🔥 ${state.progress.streak.current||0} dias</div></div></div><div class="section-title"><div><h2>Seu painel</h2><p>Tempo ativo e desempenho sincronizados.</p></div></div><div class="grid cards">${metric('Tempo de estudo',fmtTime(state.progress.studySeconds),'Leitura ativa')}${metric('Tempo em questões',fmtTime(state.progress.questionSeconds),'Resolução ativa')}${metric('Questões respondidas',state.progress.questionCount||0,`${state.progress.correctCount||0} acertos`)}${metric('Aproveitamento',accuracy()+'%',`${unlocked} insígnias desbloqueadas`)}</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title" style="margin:0 0 10px"><div><h2>Seu ranking por matéria</h2><p>Com pelo menos 5 respostas para ganhar confiança estatística.</p></div></div>${rankRows(sw.best,false,'Ainda não há dados suficientes.')}</div><div class="card"><div class="section-title" style="margin:0 0 10px"><div><h2>Onde atacar agora</h2><p>Menor aproveitamento + incidência no material.</p></div></div>${weakPriorities(sw.weak)}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title" style="margin:0"><div><h2>Últimos 7 dias</h2><p>${fmtTime(weeklySeconds())} de atividade.</p></div></div>${dayBars()}</div><div class="card level-card"><div class="level-orb">${li.level}</div><div><div class="eyebrow">${esc(li.title)}</div><h2 style="margin:5px 0">${state.progress.xp||0} XP</h2><div class="progress gold"><span style="width:${li.pct}%"></span></div><p class="muted small">Faltam ${Math.max(0,li.next-(state.progress.xp||0))} XP para o próximo nível.</p><button class="btn secondary sm" data-nav="badges">Ver conquistas</button></div></div></div>`}
function rankRows(arr,bad=false,empty='Sem dados'){if(!arr.length)return `<div class="empty">${empty}</div>`;return `<div class="rank-list">${arr.map((x,i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><div><b>${esc(x.discipline)}</b><div class="small muted">${x.attempts} respostas</div></div><div class="bar ${bad?'bad':''}"><span style="width:${x.accuracy}%"></span></div><b>${x.accuracy}%</b></div>`).join('')}</div>`}
function weakPriorities(weak){if(!weak.length)return '<div class="empty">Resolva pelo menos 5 questões em algumas matérias para o sistema identificar seus pontos de melhoria.</div>';return weak.map(x=>{const topics=state.content.priorities?.[x.discipline]||[];return `<div style="padding:10px 0;border-bottom:1px solid #22334c"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.discipline)}</b><span class="tag red">${x.accuracy}%</span></div><div class="small muted" style="margin-top:6px">Priorize: ${topics.slice(0,2).map(t=>esc(t.topic)).join(' • ')||'revisão da disciplina'}</div></div>`}).join('')}
function dayBars(){const days=last7();const vals=days.map(d=>(state.progress.studyByDay[d.key]||0)+(state.progress.questionByDay[d.key]||0));const max=Math.max(1,...vals);return `<div class="day-bars">${days.map((d,i)=>`<div class="day-col"><i title="${fmtTime(vals[i])}" style="height:${Math.max(3,vals[i]/max*100)}%"></i><span>${esc(d.label)}</span></div>`).join('')}</div>`}

function studyView(){if(!state.content)return contentMissing();if(state.reader)return readerView();const lessons=Object.values(state.content.lessons||{});const week=lessons.filter(x=>x.week);const extra=lessons.filter(x=>!x.week);return `<div class="callout"><b>Leitura direta no site.</b> O cronômetro começa ao abrir um material, pausa quando a guia fica em segundo plano e encerra ao sair do leitor.</div><div class="section-title"><div><h2>Plano de 13 semanas</h2><p>Resumos e cronogramas transcritos para o leitor.</p></div></div><div class="material-grid">${week.sort((a,b)=>a.week-b.week).map(materialCard).join('')}</div><div class="section-title"><div><h2>Biblioteca estratégica</h2><p>Lei seca, questões comentadas e materiais complementares.</p></div></div><div class="material-grid">${extra.map(materialCard).join('')}<div class="material-card"><span class="tag gold">Prioridade</span><h3>Assuntos mais cobrados</h3><p>Ranking por disciplina integrado ao seu desempenho para indicar o que revisar primeiro.</p><button class="btn secondary sm" data-action="open-priority">Abrir ranking</button></div></div>`}
function materialCard(x){return `<div class="material-card"><span class="tag">${x.kind==='legislacao'?'Lei seca':x.kind==='questoes_comentadas'?'Comentários':x.kind==='cronograma'?'Cronograma':'Resumo'}</span><h3>${esc(x.title)}</h3><p>${x.pageCount||x.pages?.length||0} páginas no leitor • ${fmtTime(state.progress.studyByLesson[x.id]||0)} estudados</p><button class="btn secondary sm" data-lesson="${esc(x.id)}">Estudar agora</button></div>`}
function openReader(id){const l=state.content.lessons[id];if(!l)return;state.reader={id,pageIndex:0,search:''};startStudy(id);render()}
function readerView(){const l=state.content.lessons[state.reader.id],pages=l.pages||[],pg=pages[state.reader.pageIndex]||pages[0];const search=state.reader.search.toLowerCase();const list=search?pages.filter(p=>(p.title+' '+p.text).toLowerCase().includes(search)):pages;return `<div class="reader"><aside class="reader-side"><div class="reader-head"><div><b>${esc(l.title)}</b><div class="small muted">Tempo desta sessão: <span class="study-timer" data-study-timer>00:00</span></div></div><button class="btn ghost sm" data-action="close-reader">Fechar</button></div><input class="input" id="readerSearch" placeholder="Buscar neste material" value="${esc(state.reader.search)}"><div class="page-list">${list.map(p=>{const ix=pages.indexOf(p);return `<button class="page-btn ${ix===state.reader.pageIndex?'active':''}" data-page="${ix}"><b>P. ${p.page}</b> — ${esc(p.title||'Conteúdo')}</button>`}).join('')}</div></aside><article class="reader-main"><h1>${esc(pg?.title||l.title)}</h1><div class="page-meta">${esc(l.title)} • página ${pg?.page||state.reader.pageIndex+1} • tempo total neste material: ${fmtTime(state.progress.studyByLesson[l.id]||0)}</div><div class="reader-text">${esc(pg?.text||'')}</div></article></div>`}

function questionList(){if(!state.content)return[];let arr=Object.values(state.content.questions||{});const f=state.filters;if(f.discipline)arr=arr.filter(q=>q.discipline===f.discipline);if(f.exam)arr=arr.filter(q=>q.exam===f.exam);if(f.status==='unanswered')arr=arr.filter(q=>!state.progress.attempts[q.id]);if(f.status==='wrong')arr=arr.filter(q=>state.progress.attempts[q.id]&&!state.progress.attempts[q.id].lastCorrect);if(f.status==='favorite')arr=arr.filter(q=>state.progress.favorites[q.id]);if(f.search){const s=f.search.toLowerCase();arr=arr.filter(q=>(q.statement+' '+q.source+' '+q.discipline).toLowerCase().includes(s))}return arr.sort((a,b)=>String(a.id).localeCompare(String(b.id),'pt-BR',{numeric:true}))}
function questionsView(){if(!state.content)return contentMissing();if(state.q)return questionDetail();const discs=state.content.meta?.disciplines||[...new Set(Object.values(state.content.questions).map(q=>q.discipline))].sort();const exams=[...new Set(Object.values(state.content.questions).map(q=>q.exam).filter(Boolean))].sort();const list=questionList();state.qList=list;return `<div class="callout"><b>${Object.keys(state.content.questions||{}).length.toLocaleString('pt-BR')} questões no banco.</b> Questões da apostila, simulados, provas históricas e recentes, além de um bloco com comentários detalhados da fonte.</div><div class="filters" style="margin-top:14px"><select class="select" id="fDisc"><option value="">Todas as matérias</option>${discs.map(d=>`<option ${state.filters.discipline===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select class="select" id="fExam"><option value="">Todas as fontes/provas</option>${exams.map(d=>`<option ${state.filters.exam===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select class="select" id="fStatus"><option value="all">Todas</option><option value="unanswered" ${state.filters.status==='unanswered'?'selected':''}>Não respondidas</option><option value="wrong" ${state.filters.status==='wrong'?'selected':''}>Erros para revisar</option><option value="favorite" ${state.filters.status==='favorite'?'selected':''}>Favoritas</option></select><input class="input" id="fSearch" placeholder="Buscar questão" value="${esc(state.filters.search)}"></div><div class="grid two"><div class="card"><div class="section-title" style="margin:0"><div><h2>${list.length.toLocaleString('pt-BR')} encontradas</h2><p>O sistema registra tempo, resposta e evolução por matéria.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-action="start-filtered" ${!list.length?'disabled':''}>Começar agora</button><button class="btn secondary" data-action="random" ${!list.length?'disabled':''}>Questão aleatória</button></div></div><div class="card"><div class="eyebrow">Caderno de erros</div><div class="value" style="font-size:1.6rem;font-weight:950;margin-top:8px">${Object.values(state.progress.attempts).filter(a=>!a.lastCorrect).length}</div><p class="muted small">Questões cujo último resultado foi erro. Use o filtro “Erros para revisar”.</p></div></div><div class="section-title"><div><h2>Fontes</h2><p>Nenhuma questão genérica criada para preencher banco.</p></div></div><div class="material-grid"><div class="material-card"><span class="tag">Banco</span><h3>Apostila — 1.000 questões</h3><p>Questões e gabaritos extraídos do arquivo enviado.</p></div><div class="material-card"><span class="tag green">Gran OAB</span><h3>1.600 questões • 18º ao 37º EOU</h3><p>20 cadernos de 80 questões, organizados por prova e disciplina.</p></div><div class="material-card"><span class="tag green">FGV/OAB</span><h3>43º, 44º, 45º e 46º EOU</h3><p>Cadernos incorporados com organização por disciplina.</p></div><div class="material-card"><span class="tag gold">Comentadas</span><h3>Damásio</h3><p>14 questões com comentários detalhados transcritos do material.</p></div></div>`}
function openQuestion(index=0){state.qList=questionList();if(!state.qList.length)return;state.qIndex=Math.max(0,Math.min(index,state.qList.length-1));state.q=state.qList[state.qIndex];startQuestionSession(state.q.id);render()}
function supportFor(q){const leg=state.content.lessons?.legislacao;if(!leg)return null;const sec=(state.content.legislationSections||[]).find(s=>s.discipline===q.discipline);let pages=leg.pages||[];if(sec)pages=pages.filter(p=>p.page>=sec.start&&p.page<=sec.end);if(!pages.length)return null;const stop=new Set('sobre para como uma umas uns dos das que com sem pela pelo este esta essa esse isso aquilo mais menos cada ainda então onde quando porque assinale correta afirmativa direito'.split(' '));const tokens=(q.statement||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z]{5,}/g)||[];const good=[...new Set(tokens.filter(t=>!stop.has(t)))].slice(0,30);let best=null,score=-1;for(const p of pages){const tx=(p.text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let s=good.reduce((n,t)=>n+(tx.includes(t)?1:0),0);if(s>score){best=p;score=s}}if(!best)return null;let text=best.text||'';const needle=good.find(t=>text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(t));let pos=needle?text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').indexOf(needle):0;pos=Math.max(0,pos-180);let excerpt=text.slice(pos,pos+900).trim();if(pos>0)excerpt='…'+excerpt;if(pos+900<text.length)excerpt+='…';return{page:best.page,excerpt}}
function questionDetail(){const q=state.q,attempt=state.progress.attempts[q.id],answered=attempt?.shownThisSession===true,selected=attempt?.sessionSelected;const support=answered?supportFor(q):null;return `<div class="q-layout"><section class="card question-card"><div class="q-meta"><span class="tag">${esc(q.discipline)}</span><span class="tag ${q.kind==='comentada'?'gold':''}">${esc(q.exam||q.source)}</span>${q.annulled?'<span class="tag red">Anulada</span>':''}<span class="tag">${state.qIndex+1}/${state.qList.length}</span></div><div class="q-title"><b>Questão ${q.displayNumber||q.number}</b><br>${esc(q.statement)}</div><div class="options">${q.options.map((o,i)=>{let cls='';if(answered){if(q.annulled)cls='selected';else if(i===q.answer)cls='correct';else if(i===selected&&i!==q.answer)cls='wrong'}else if(selected===i)cls='selected';return `<button class="option ${cls}" data-option="${i}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('')}</div>${answered?`<div class="commentary"><div class="eyebrow">Comentário da questão</div><div class="box" style="margin-top:8px"><b>${q.annulled?'Questão anulada':`Resposta: ${String.fromCharCode(65+q.answer)}`}</b><p>${esc(q.comment||'')}</p><div class="small muted">Fonte do comentário: ${esc(q.commentSource||q.source)}</div></div>${support?`<div class="box support-box"><strong>Apoio no seu material — ${esc(q.discipline)} • Legislação p. ${support.page}</strong><p>${esc(support.excerpt)}</p></div>`:''}</div>`:''}<div class="q-actions"><div style="display:flex;gap:8px"><button class="btn ghost sm" data-action="fav">${state.progress.favorites[q.id]?'★ Favorita':'☆ Favoritar'}</button><button class="btn ghost sm" data-action="note">✎ Anotação</button></div><div style="display:flex;gap:8px"><button class="btn secondary sm" data-action="prev-q" ${state.qIndex===0?'disabled':''}>Anterior</button>${!answered?'<button class="btn sm" data-action="answer">Responder</button>':'<button class="btn sm" data-action="next-q">Próxima</button>'}</div></div><div class="note-area ${state.progress.notes[q.id]?'':'hidden'}" id="noteArea"><textarea class="textarea" id="qNote" placeholder="Sua anotação pessoal...">${esc(state.progress.notes[q.id]||'')}</textarea><button class="btn secondary sm" data-action="save-note">Salvar anotação</button></div></section><aside class="q-side"><div class="card"><div class="eyebrow">Tempo nesta questão</div><div class="timer-box" data-q-timer>00:00</div><div class="small muted">Pausa com a guia em segundo plano.</div></div><div class="card"><div class="eyebrow">Histórico</div><div style="font-size:1.5rem;font-weight:950;margin-top:6px">${attempt?.count||0}</div><div class="small muted">tentativas • ${attempt?.count?Math.round((attempt.correctCount||0)/attempt.count*100):0}% de acerto</div>${attempt?.lastCorrect===false?'<div class="tag red" style="margin-top:10px">Revisar novamente</div>':attempt?.lastCorrect===true?'<div class="tag green" style="margin-top:10px">Última resposta correta</div>':''}</div><button class="btn ghost" data-action="back-list">← Voltar ao banco</button></aside></div>`}
async function answerQuestion(){const q=state.q;if(!q)return;let a=state.progress.attempts[q.id]||{count:0,correctCount:0,totalTime:0,discipline:q.discipline};const sel=a.sessionSelected;if(sel===undefined||sel===null)return toast('Selecione uma alternativa.','bad');const elapsed=endQuestionSession();const correct=q.annulled||sel===q.answer;const previouslyWrong=a.count>0&&a.lastCorrect===false;a.count++;a.correctCount+=(correct?1:0);a.totalTime=(a.totalTime||0)+elapsed;a.lastCorrect=correct;a.lastSelected=sel;a.lastAt=Date.now();const prevDay=a.lastDay;a.lastDay=todayKey();a.todayCount=(prevDay===a.lastDay?((a.todayCount||0)+1):1);a.shownThisSession=true;state.progress.attempts[q.id]=a;state.progress.questionCount++;if(correct)state.progress.correctCount++;else state.progress.wrongCount++;if(previouslyWrong&&correct){state.progress.recoveredErrors=(state.progress.recoveredErrors||0)+1;addXP(15)}addXP(correct?(a.count===1?12:5):(a.count===1?4:2));touchActivity();checkBadges();await persistProgress();render()}
function resetSessionDisplay(qid){const a=state.progress.attempts[qid];if(a){delete a.shownThisSession;delete a.sessionSelected}}
function moveQuestion(delta){resetSessionDisplay(state.q.id);endQuestionSession();state.qIndex=Math.max(0,Math.min(state.qIndex+delta,state.qList.length-1));state.q=state.qList[state.qIndex];startQuestionSession(state.q.id);render()}

function simulationsView(){if(!state.content)return contentMissing();if(state.sim)return simulationRun();const groups={};for(const q of Object.values(state.content.questions||{})){if(!['simulado','prova_oficial'].includes(q.kind))continue;(groups[q.exam]||(groups[q.exam]=[])).push(q)}const hist=state.progress.simulationHistory||[];return `<div class="callout"><b>Modo prova:</b> o cronômetro roda durante a resolução e o gabarito só aparece ao finalizar.</div><div class="material-grid" style="margin-top:16px">${Object.entries(groups).sort().map(([name,qs])=>{const h=hist.filter(x=>x.exam===name).sort((a,b)=>b.at-a.at)[0];return `<div class="material-card"><span class="tag ${name.includes('EOU')?'green':''}">${qs.length} questões</span><h3>${esc(name)}</h3><p>${h?`Último resultado: ${h.score}/${h.total} • ${Math.round(h.score/h.total*100)}%`:'Ainda não realizado nesta conta.'}</p><button class="btn secondary sm" data-sim="${esc(name)}">Iniciar simulado</button></div>`}).join('')}</div>`}
function startSim(name){const qs=Object.values(state.content.questions).filter(q=>q.exam===name).sort((a,b)=>a.number-b.number);state.sim={exam:name,qs,index:0,answers:{},startedAt:Date.now(),runningSince:Date.now(),activeSeconds:0};endStudy();endQuestionSession();render()}
function simulationRun(){const s=state.sim,q=s.qs[s.index],sel=s.answers[q.id];return `<div class="q-layout"><section class="card question-card"><div class="q-meta"><span class="tag green">${esc(s.exam)}</span><span class="tag">${s.index+1}/${s.qs.length}</span><span class="tag">${esc(q.discipline)}</span></div><div class="q-title">${esc(q.statement)}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${sel===i?'selected':''}" data-sim-option="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="q-actions"><button class="btn secondary sm" data-action="sim-prev" ${s.index===0?'disabled':''}>Anterior</button><div style="display:flex;gap:8px"><button class="btn secondary sm" data-action="sim-next" ${s.index===s.qs.length-1?'disabled':''}>Próxima</button><button class="btn" data-action="sim-finish">Finalizar prova</button></div></div></section><aside class="q-side"><div class="card"><div class="eyebrow">Tempo de prova</div><div class="timer-box" data-sim-timer>${fmtClock((Date.now()-s.startedAt)/1000)}</div><div class="small muted">${Object.keys(s.answers).length}/${s.qs.length} respondidas</div></div><div class="card"><div class="eyebrow">Mapa</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">${s.qs.map((x,i)=>`<button class="btn ${s.answers[x.id]!==undefined?'ok':'ghost'} sm" style="padding:6px 8px" data-sim-index="${i}">${i+1}</button>`).join('')}</div></div></aside></div>`}
async function finishSim(){const s=state.sim;if(!confirm(`Finalizar ${s.exam}? ${Object.keys(s.answers).length}/${s.qs.length} respondidas.`))return;let score=0;for(const q of s.qs){if(q.annulled||s.answers[q.id]===q.answer)score++}const sec=Math.round((Date.now()-s.startedAt)/1000);state.progress.questionSeconds+=sec;const day=todayKey();state.progress.questionByDay[day]=(state.progress.questionByDay[day]||0)+sec;state.progress.simulationHistory.push({exam:s.exam,score,total:s.qs.length,seconds:sec,at:Date.now()});addXP(score*2);if(score>=40&&s.qs.length>=80)addXP(100);touchActivity();checkBadges();await persistProgress();const exam=s.exam,total=s.qs.length;state.sim=null;render();toast(`${exam}: ${score}/${total} acertos (${Math.round(score/total*100)}%).`)}

function statsView(){const ds=disciplineStats();const sw=strengths();const byLesson=Object.entries(state.progress.studyByLesson||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);return `<div class="grid cards">${metric('Foco total',fmtTime(state.progress.studySeconds+state.progress.questionSeconds))}${metric('Tempo médio/questão',fmtTime(state.progress.questionCount?state.progress.questionSeconds/state.progress.questionCount:0))}${metric('Melhor sequência',(state.progress.streak.best||0)+' dias')}${metric('XP acumulado',state.progress.xp||0)}</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-title" style="margin:0"><div><h2>Desempenho por matéria</h2><p>Ranking baseado em suas respostas.</p></div></div>${rankRows(ds.slice(0,10))}</div><div class="card"><div class="section-title" style="margin:0"><div><h2>Tempo por material</h2><p>Onde você realmente investiu tempo ativo.</p></div></div>${byLesson.length?byLesson.map(([id,sec])=>`<div style="padding:10px 0;border-bottom:1px solid #22334c;display:flex;justify-content:space-between;gap:12px"><span>${esc(state.content?.lessons?.[id]?.title||id)}</span><b>${fmtTime(sec)}</b></div>`).join(''):'<div class="empty">Abra um material para iniciar a medição.</div>'}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Melhores matérias</h2>${rankRows(sw.best)}</div><div class="card"><h2>Precisa melhorar</h2>${rankRows(sw.weak,true)}</div></div><div class="card" style="margin-top:16px"><div class="section-title" style="margin:0"><div><h2>Atividade dos últimos 7 dias</h2><p>Leitura + questões.</p></div></div>${dayBars()}</div>`}
function rankingView(){const ds=disciplineStats().filter(x=>x.attempts>=5);const best=ds.slice(0,20),weak=[...ds].sort((a,b)=>a.accuracy-b.accuracy||b.attempts-a.attempts);const lb=Object.entries(state.leaderboard||{}).map(([uid,x])=>({uid,...x})).filter(x=>x.name).sort((a,b)=>(b.xp||0)-(a.xp||0));return `<div class="grid two"><div class="card"><div class="eyebrow">Seu mapa de domínio</div><h2>Do melhor para o que mais precisa melhorar</h2>${rankRows(best,false,'Responda mais questões para liberar o ranking.')}</div><div class="card"><div class="eyebrow">Plano de ataque</div><h2>3 prioridades</h2>${weak.slice(0,3).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #22334c"><div style="display:flex;justify-content:space-between"><b>${esc(x.discipline)}</b><span class="tag red">${x.accuracy}%</span></div><p class="small muted">${(state.content?.priorities?.[x.discipline]||[]).slice(0,3).map(t=>`${esc(t.topic)} (${t.frequency}x)`).join(' • ')||'Faça revisão + novo bloco de questões.'}</p><button class="btn secondary sm" data-practice-disc="${esc(x.discipline)}">Treinar matéria</button></div>`).join('')||'<div class="empty">Ainda não há dados suficientes.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="section-title" style="margin:0"><div><h2>Ranking da turma</h2><p>XP combina estudo ativo, questões e conquistas. O conteúdo de cada usuário continua separado.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Usuário</th><th>Nível</th><th>XP</th><th>Questões</th><th>Acerto</th><th>Estudo</th></tr></thead><tbody>${lb.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b>${x.uid===state.user.uid?' <span class="tag">você</span>':''}</td><td>${x.level||1}</td><td>${x.xp||0}</td><td>${x.questions||0}</td><td>${x.accuracy||0}%</td><td>${fmtTime(x.studySeconds||0)}</td></tr>`).join('')||'<tr><td colspan="7">Sem dados.</td></tr>'}</tbody></table></div></div>`}
function badgesView(){const li=levelInfo(state.progress.xp),badges=state.content?.badges||[];return `<div class="grid two"><div class="card level-card"><div class="level-orb">${li.level}</div><div><div class="eyebrow">${esc(li.title)}</div><h2>${state.progress.xp||0} XP</h2><div class="progress gold"><span style="width:${li.pct}%"></span></div><p class="small muted">Próximo nível em ${Math.max(0,li.next-state.progress.xp)} XP.</p></div></div><div class="card mission"><div><div class="eyebrow">Como ganhar XP</div><h3 style="margin:5px 0">Estude, resolva, evolua</h3></div><div class="small muted">+2 XP por minuto ativo • até +12 XP por questão • bônus por recuperar erros • +50 XP por nova insígnia • bônus em simulados.</div></div></div><div class="section-title"><div><h2>Insígnias</h2><p>${Object.keys(state.progress.badges).length}/${badges.length} desbloqueadas.</p></div></div><div class="badge-grid">${badges.map(b=>{const u=state.progress.badges[b.id];return `<div class="badge ${u?'':'locked'}"><div class="icon">${b.icon}</div><h3>${esc(b.name)}</h3><p>${esc(b.desc)}</p><div class="small" style="margin-top:9px;color:${u?'#a7f3d0':'#94a3b8'}">${u?`Desbloqueada em ${new Date(u).toLocaleDateString('pt-BR')}`:'Bloqueada'}</div></div>`}).join('')}</div>`}

function adminView(){const profiles=Object.entries(state.profiles||{});return `<div class="callout warn"><b>Conteúdo privado:</b> o arquivo JSON de importação não deve ir para o GitHub. O GitHub hospeda apenas a interface; os materiais transcritos ficam no Firebase e só são liberados para contas ativas.</div><div class="admin-grid" style="margin-top:16px"><div class="card"><div class="eyebrow">Conteúdo</div><h2>Importar base privada</h2><p class="muted small">Use o arquivo <b>OAB_Focus_CONTEUDO_PRIVADO_v4.json</b>. Isso envia resumos, legislação e questões para o Realtime Database.</p><input class="input" id="seedFile" type="file" accept="application/json"><button class="btn" data-action="import-seed" style="margin-top:10px">Importar / atualizar conteúdo</button><div id="importStatus" class="small muted" style="margin-top:9px"></div></div><div class="card"><div class="eyebrow">Novo usuário</div><h2>Cadastrar aluno</h2><div class="field"><label>Nome de exibição</label><input class="input" id="newName" placeholder="Ex.: Kelly Silva"></div><div class="field"><label>Usuário</label><input class="input" id="newUser" placeholder="Ex.: kelly"></div><div class="field"><label>Senha inicial</label><input class="input" id="newPass" type="password" placeholder="mín. 5 caracteres"></div><button class="btn" data-action="create-user">Criar conta</button></div></div><div class="card" style="margin-top:16px"><div class="section-title" style="margin:0"><div><h2>Usuários cadastrados</h2><p>O administrador pode criar e desativar acesso.</p></div></div><div>${profiles.map(([uid,p])=>`<div class="user-row"><div><b>${esc(p.displayName||p.username)}</b> <span class="tag ${p.role==='admin'?'gold':''}">${p.role||'student'}</span><div class="small muted">@${esc(p.username||'')} • ${p.active?'ativo':'desativado'}</div></div>${p.role==='admin'?'':`<button class="btn ${p.active?'danger':'ok'} sm" data-toggle-user="${uid}" data-active="${p.active?'1':'0'}">${p.active?'Desativar':'Ativar'}</button> function bindActions(){$$('[data-lesson]').forEach(b=>b.onclick=()=>openReader(b.dataset.lesson));$$('[data-page]').forEach(b=>b.onclick=()=>{state.reader.pageIndex=+b.dataset.page;render()});$('#readerSearch')?.addEventListener('input',e=>{state.reader.search=e.target.value;render()});$('[data-action="close-reader"]')?.addEventListener('click',()=>{endStudy();state.reader=null;render()});$('[data-action="open-priority"]')?.addEventListener('click',()=>{state.view='priority';render()});
 const fDisc=$('#fDisc'),fExam=$('#fExam'),fStatus=$('#fStatus'),fSearch=$('#fSearch');for(const [el,key] of [[fDisc,'discipline'],[fExam,'exam'],[fStatus,'status']])el?.addEventListener('change',e=>{state.filters[key]=e.target.value;render()});fSearch?.addEventListener('change',e=>{state.filters.search=e.target.value.trim();render()});$('[data-action="start-filtered"]')?.addEventListener('click',()=>openQuestion(0));$('[data-action="random"]')?.addEventListener('click',()=>{const l=questionList();if(l.length){state.qList=l;state.qIndex=Math.floor(Math.random()*l.length);state.q=l[state.qIndex];startQuestionSession(state.q.id);render()}});
 $$('[data-option]').forEach(b=>b.onclick=()=>{let a=state.progress.attempts[state.q.id]||{count:0,correctCount:0,totalTime:0,discipline:state.q.discipline};a.sessionSelected=+b.dataset.option;a.shownThisSession=false;state.progress.attempts[state.q.id]=a;render()});$('[data-action="answer"]')?.addEventListener('click',answerQuestion);$('[data-action="next-q"]')?.addEventListener('click',()=>moveQuestion(1));$('[data-action="prev-q"]')?.addEventListener('click',()=>moveQuestion(-1));$('[data-action="back-list"]')?.addEventListener('click',()=>{resetSessionDisplay(state.q.id);endQuestionSession();state.q=null;render()});$('[data-action="fav"]')?.addEventListener('click',()=>{const id=state.q.id;if(state.progress.favorites[id])delete state.progress.favorites[id];else state.progress.favorites[id]=true;persistProgress();render()});$('[data-action="note"]')?.addEventListener('click',()=>$('#noteArea')?.classList.toggle('hidden'));$('[data-action="save-note"]')?.addEventListener('click',()=>{const v=$('#qNote').value.trim();if(v)state.progress.notes[state.q.id]=v;else delete state.progress.notes[state.q.id];persistProgress();toast('Anotação salva.')});
 $$('[data-sim]').forEach(b=>b.onclick=()=>startSim(b.dataset.sim));$$('[data-sim-option]').forEach(b=>b.onclick=()=>{state.sim.answers[state.sim.qs[state.sim.index].id]=+b.dataset.simOption;render()});$$('[data-sim-index]').forEach(b=>b.onclick=()=>{state.sim.index=+b.dataset.simIndex;render()});$('[data-action="sim-prev"]')?.addEventListener('click',()=>{state.sim.index=Math.max(0,state.sim.index-1);render()});$('[data-action="sim-next"]')?.addEventListener('click',()=>{state.sim.index=Math.min(state.sim.qs.length-1,state.sim.index+1);render()});$('[data-action="sim-finish"]')?.addEventListener('click',finishSim);
 $$('[data-practice-disc]').forEach(b=>b.onclick=()=>{state.filters={discipline:b.dataset.practiceDisc,exam:'',status:'all',search:''};state.view='questions';render()});$('[data-action="import-seed"]')?.addEventListener('click',importSeed);$('[data-action="create-user"]')?.addEventListener('click',createStudent);$$('[data-toggle-user]').forEach(b=>b.onclick=()=>toggleUser(b.dataset.toggleUser,b.dataset.active==='1'))}

setInterval(()=>{const t=$('[data-sim-timer]');if(t&&state.sim)t.textContent=fmtClock((Date.now()-state.sim.startedAt)/1000);updateLiveTimers()},1000);


function startupError(err){
  console.error('OAB Focus startup error:',err);
  const el=document.getElementById('app');
  if(!el)return;
  const safe=String(err?.message||err).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  el.innerHTML=`<div class="login-shell"><div class="login-card"><div class="login-logo"><div class="brandmark">!</div><div><h1>OAB Focus</h1><span class="eyebrow">Diagnóstico</span></div></div><h2>O site não conseguiu iniciar</h2><p>O arquivo abriu, mas a conexão com os módulos do Firebase falhou. Atualize com <b>Ctrl + F5</b>. Se continuar, envie uma foto desta mensagem.</p><div class="callout warn"><b>Erro técnico:</b><br>${safe}</div><button class="btn" style="width:100%;margin-top:16px" onclick="location.reload()">Tentar novamente</button></div></div>`;
}
async function loadModule(url){
  return await Promise.race([import(url),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo esgotado ao carregar o Firebase. Verifique sua conexão ou bloqueador de conteúdo.')),12000))]);
}
async function bootOABFocus(){
  try{
    const [appMod,authMod,dbMod]=await Promise.all([
      loadModule('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
      loadModule('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),
      loadModule('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js')
    ]);
    ({initializeApp,deleteApp}=appMod);
    ({getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updatePassword}=authMod);
    ({getDatabase,ref,get,set,update}=dbMod);
    fb=initializeApp(firebaseConfig); auth=getAuth(fb); db=getDatabase(fb);
    onAuthStateChanged(auth,async user=>{if(state.loggingIn)return;if(!user){if(!state.user)loginScreen();return}if(!state.user){state.user=user;try{await loadSession()}catch(e){console.error(e);loginScreen('Erro ao carregar a conta.')}}});
    loginScreen();
  }catch(e){startupError(e)}
}
bootOABFocus();

</script></body></html>
