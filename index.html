<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="OAB Focus — plataforma pessoal de estudos para a 1ª fase da OAB.">
  <title>OAB Focus</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="login-gate" id="loginGate">
    <div class="login-panel">
      <div class="mark">OF</div>
      <div class="kicker">OAB FOCUS • ACESSO PESSOAL</div>
      <h1>Seu ambiente de estudos.</h1>
      <p>Questões reais do material enviado, simulados, cronograma e revisão dos seus erros.</p>
      <form id="loginForm" class="login-form">
        <label>Login<input id="username" autocomplete="username" placeholder="Manassés Oliveira" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" placeholder="•••••" required></label>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
      <div id="loginMessage" class="form-message"></div>
      <small>Uso pessoal • progresso sincronizado no Firebase Realtime Database</small>
    </div>
  </div>

  <div class="app locked" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="mark small">OF</div><div><strong>OAB Focus</strong><span>1ª fase</span></div></div>
      <nav>
        <button class="nav active" data-route="home">⌂ <span>Início</span></button>
        <button class="nav" data-route="questions">✓ <span>Questões</span></button>
        <button class="nav" data-route="review">↻ <span>Revisão</span></button>
        <button class="nav" data-route="simulations">◷ <span>Simulados</span></button>
        <button class="nav" data-route="schedule">▦ <span>Cronograma</span></button>
        <button class="nav" data-route="materials">▤ <span>Materiais</span></button>
        <button class="nav" data-route="stats">▥ <span>Estatísticas</span></button>
        <button class="nav" data-route="settings">⚙ <span>Configurações</span></button>
      </nav>
      <div class="side-bottom">
        <div class="cloud" id="cloudStatus"><i></i><div><b>Firebase</b><span>conectando…</span></div></div>
        <button class="btn ghost full" id="logoutBtn">Sair</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-btn mobile" id="menuBtn">☰</button>
        <div><div class="kicker" id="eyebrow">OAB FOCUS</div><h1 id="pageTitle">Painel de estudos</h1></div>
        <div class="top-actions"><div class="goal"><span>Meta</span><b id="goalDone">0</b>/<span id="goalTarget">20</span></div><div class="avatar">MO</div></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
